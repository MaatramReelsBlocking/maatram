# Every morning (7:00 am IST) copies the survey's suggestions into SUGGESTIONS.md, so the daily
# bug sweep has one file to read. Free: runs on GitHub, uses no Claude usage and no secrets.
# Manual run: Actions tab -> Survey suggestions -> Run workflow.
name: Survey suggestions

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC = 07:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survey-suggestions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/collect-suggestions.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- SUGGESTIONS.md && [ -f SUGGESTIONS.md ] && git ls-files --error-unmatch SUGGESTIONS.md >/dev/null 2>&1; then
            echo "No new suggestions."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUGGESTIONS.md
          git commit -m "Survey suggestions: daily update"
          git push
